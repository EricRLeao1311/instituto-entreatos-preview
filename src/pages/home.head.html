<style>
  .marquee-wrapper {
    width: 100%;
    overflow: hidden;
  }

  .marquee-track {
    display: flex;
    width: max-content;
    animation: marquee-scroll 24s linear infinite;
  }

  .marquee-list {
    display: flex;
    gap: 24px;
    flex: none;
  }

  @keyframes marquee-scroll {
    from {
      transform: translateX(0);
    }

    to {
      transform: translateX(-50%);
    }
  }

  .marquee-wrapper:hover .marquee-track {
    animation-play-state: paused;
  }
</style>
